<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rick and Morty 3D: Total Rickall of Parts</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Everything below is 2D overlay drawn by the browser on top of the 3D canvas -->
    <div id="vignette"></div>
    <div id="bar-top" class="bar"></div>
    <div id="bar-bottom" class="bar"></div>
    <div id="fade"></div>
    <div id="flash"></div>

    <div id="goal"></div>
    <div id="prompt"><span class="key">SPACE</span> <span id="prompt-text"></span></div>
    <div id="caption"></div>
    <div id="toast"></div>
    <div id="parts"><span></span><span></span><span></span></div>
    <div id="hint"></div>

    <!-- Boss fight: HP bars, action menu, the timing ring, damage numbers -->
    <div id="battle">
      <div class="hp" id="hp-morty"><div class="hp-name">MORTY</div><div class="hp-track"><div class="hp-ghost"></div><div class="hp-fill"></div></div><div class="hp-num"></div><div class="hp-tags"></div></div>
      <div class="hp right" id="hp-boss"><div class="hp-name">SHRIMP RICK</div><div class="hp-track"><div class="hp-ghost"></div><div class="hp-fill"></div></div><div class="hp-num"></div><div class="hp-tags"></div></div>
      <div id="bmenu"><div id="bmenu-list"></div><div id="bmenu-desc"></div></div>
      <div id="bbanner"></div>
      <div id="sauce"></div>
      <div id="ring"><div id="ring-target"></div><div id="ring-moving"></div><div id="ring-label"></div></div>
      <div id="pops"></div>
    </div>

    <div id="dialogue">
      <img id="dlg-portrait" alt="" />
      <div id="dlg-box">
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
        <div id="dlg-choices"></div>
        <div id="dlg-arrow">▼</div>
      </div>
    </div>

    <!-- Summer's phone: the quest log (Q) -->
    <div id="phone">
      <div id="phone-screen">
        <div id="phone-app"></div>
        <div id="phone-title"></div>
        <div id="phone-sub"></div>
        <ul id="phone-tasks"></ul>
        <div class="phone-label" id="phone-parts-label"></div>
        <div id="phone-parts"></div>
        <div class="phone-label" id="phone-pockets-label"></div>
        <div id="phone-pockets"></div>
        <div id="phone-note"></div>
      </div>
      <div id="phone-close"></div>
    </div>

    <div id="card">
      <div id="card-small"></div>
      <div id="card-big"></div>
      <div id="card-hint"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
